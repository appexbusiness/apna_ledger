name: apna_ledger
description: "Apna Ledger — Rakhe Pai Pai Ka Hisaab. Premium personal & business finance tracker."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # Local storage (session, prefs)
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.69.0

  # UI / fonts / icons
  google_fonts: ^6.2.1

  # Utils
  equatable: ^2.0.5
  uuid: ^4.5.1
  crypto: ^3.0.5

  # Export / sharing (CSV + PDF; download on web, share sheet on mobile)
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  pdf: ^3.11.1

  # Branding / links / security / connectivity
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  flutter_svg: ^2.0.10+1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo_512.png
    - assets/branding/splash_logo.png
    - assets/branding/apna_ledger_logo.svg
    - assets/branding/google_g.svg
    - assets/branding/appex_logo.png

# ---------------------------------------------------------------------------
# App icons — run:  dart run flutter_launcher_icons
# Generates Android (incl. adaptive), iOS and web icons from the logo.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/branding/apna_ledger_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/apna_ledger_logo.png"
    background_color: "#0F2A43"
    theme_color: "#0F766E"
  adaptive_icon_background: "#0F2A43"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

# ---------------------------------------------------------------------------
# Native splash — run:  dart run flutter_native_splash:create
# Branded launch screen (Android 12+ uses the adaptive splash API).
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#0F2A43"
  image: assets/branding/splash_logo.png
  color_dark: "#0B1F31"
  image_dark: assets/branding/splash_logo.png
  android_12:
    color: "#0F2A43"
    image: assets/branding/splash_logo.png
    color_dark: "#0B1F31"
    image_dark: assets/branding/splash_logo.png
  web: true
