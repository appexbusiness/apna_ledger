<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apna Ledger — Rakhe Pai Pai Ka Hisaab. By Appex Business.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Apna Ledger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Sign-In (QA web client id). For production builds swap this id. -->
  <meta name="google-signin-client_id"
        content="839704694234-ab4qoiviae2orjj192vagkkpatgp0s0s.apps.googleusercontent.com">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Apna Ledger</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0F2A43; }
    #app-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0F2A43;
      transition: opacity .4s ease; z-index: 9999;
    }
    #app-loader img { width: 96px; height: 96px; margin-bottom: 20px;
      animation: pop .7s ease; }
    #app-loader .name { color: #fff; font-family: sans-serif; font-size: 20px;
      font-weight: 700; letter-spacing: .3px; }
    #app-loader .tag { color: rgba(255,255,255,.7); font-family: sans-serif;
      font-size: 12px; margin-top: 4px; }
    #app-loader .spinner { margin-top: 22px; width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
      border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="app-loader">
    <img src="icons/Icon-192.png" alt="Apna Ledger"/>
    <div class="name">Apna Ledger</div>
    <div class="tag">Rakhe Pai Pai Ka Hisaab</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove the branded loader as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('app-loader');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
